<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roads Empire</title>
<style>
  :root {
    --asphalt: #23262b;
    --asphalt-2: #2e3238;
    --paper: #f3f1ec;
    --line: #e4b429;
    --ink: #1b1d20;
    --muted: #6b7077;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17191c;
      --ink: #ecebe6;
      --muted: #9a9ea5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #090a11;
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.7;
    min-height: 100vh;
    isolation: isolate;
  }

  /* Атмосферный фон: символы, наклейки и цитаты плавно меняют места */
  .ambient-layer {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 18%, rgba(88, 28, 135, .24), transparent 38%),
      radial-gradient(ellipse at 85% 75%, rgba(20, 75, 115, .2), transparent 42%),
      radial-gradient(ellipse at 55% 45%, rgba(60, 30, 75, .12), transparent 55%),
      linear-gradient(135deg, #080910, #11101a 48%, #080b12);
  }
  .ambient-layer::before {
    content: ""; position: absolute; inset: -50%;
    background: conic-gradient(from 0deg, transparent, rgba(116, 61, 180, .12), transparent, rgba(36, 115, 145, .1), transparent);
    filter: blur(55px); animation: ambient-flow 28s linear infinite;
  }
  .ambient-sticker {
    position: absolute; display: block; color: rgba(190, 170, 225, .18);
    font: 800 clamp(1.5rem, 4vw, 3.4rem)/1 Arial, sans-serif;
    letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
    text-shadow: 0 0 22px rgba(130, 80, 190, .18);
    animation: sticker-drift 18s ease-in-out infinite alternate;
  }
  .ambient-sticker.symbol { color: rgba(120, 170, 205, .2); font-size: clamp(2rem, 5vw, 4.5rem); }
  .ambient-sticker.s1 { top: 14%; left: 5%; }
  .ambient-sticker.s2 { top: 34%; right: 6%; animation-delay: -5s; }
  .ambient-sticker.s3 { bottom: 18%; left: 9%; animation-delay: -9s; }
  .ambient-sticker.s4 { bottom: 10%; right: 8%; animation-delay: -13s; }
  .ambient-sticker.s5 { top: 65%; left: 47%; animation-delay: -7s; }
  .ambient-sticker.quote {
    max-width: min(330px, 40vw); white-space: normal; padding: 12px 16px;
    border: 1px solid rgba(178, 145, 220, .2); border-left: 3px solid rgba(145, 95, 205, .45);
    border-radius: 9px; background: rgba(12, 10, 22, .28);
    color: rgba(225, 214, 242, .38); font: 600 clamp(.75rem, 1.3vw, .95rem)/1.45 Arial, sans-serif;
    letter-spacing: .015em; text-transform: none; opacity: 0;
    transform: translateY(12px) scale(.97);
    transition: left 2.2s ease, top 2.2s ease, right 2.2s ease, bottom 2.2s ease, opacity 1.4s ease, transform 1.8s ease;
  }
  .ambient-sticker.quote.show { opacity: 1; transform: translateY(0) scale(1); }
  .ambient-sticker.quote small { display: block; margin-top: 6px; color: rgba(170, 145, 205, .48); font-size: .72em; letter-spacing: .1em; text-transform: uppercase; }
  @keyframes ambient-flow { to { transform: rotate(360deg); } }
  @keyframes sticker-drift {
    from { transform: translate3d(-10px, -8px, 0) rotate(-5deg); }
    to { transform: translate3d(16px, 13px, 0) rotate(5deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ambient-layer::before, .ambient-sticker { animation: none; }
    .ambient-sticker.quote { transition: none; }
  }

  header {
    background: var(--asphalt);
    padding: 40px 20px 28px;
    border-bottom: 6px solid var(--asphalt-2);
    position: relative;
    isolation: isolate;
    overflow: hidden;
  }
  /* Видео-фон шапки: положите background.mp4 рядом с index.html */
  .header-video {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(10, 8, 18, .78), rgba(20, 18, 28, .88));
    pointer-events: none;
  }
  header .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* разметка дороги: жёлтая прерывистая линия */
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 0;
    border-bottom: 3px dashed var(--line);
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  .logo {
    margin: 0 0 24px;
    text-align: center;
    align-self: center;
    font-family: "Arial Black", Impact, sans-serif;
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    letter-spacing: -0.02em;
    /* фиолетовый, переливающийся в тёмных тонах */
    color: #7c3aed;
    background: linear-gradient(100deg, #4c1d95, #7c3aed, #a855f7, #5b21b6, #6d28d9, #4c1d95);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: logo-shimmer 6s linear infinite;
    filter: drop-shadow(0 0 14px rgba(124, 58, 237, .45));
    display: inline-block;
  }
  @keyframes logo-shimmer {
    from { background-position: 0% 50%; }
    to   { background-position: 300% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
  }

  /* 3 вкладки в ряд, 3 ряда сверху вниз = 9 вкладок */
  nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }
  nav button {
    font: inherit;
    font-family: Arial, sans-serif;
    font-size: 1.08rem;
    padding: 16px 14px;
    border: 2px solid var(--asphalt-2);
    border-radius: 7px;
    background: var(--asphalt-2);
    color: #c9ccd1;
    cursor: pointer;
    text-align: center;
  }
  nav button:hover { border-color: var(--line); color: #fff; }
  nav button[aria-selected="true"] {
    background: var(--line);
    border-color: var(--line);
    color: var(--ink);
    font-weight: 700;
  }
  nav button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  /* особая вкладка: при наведении переливается цветами */
  nav button.special,
  nav button.special[aria-selected="true"] {
    border-color: transparent;
    position: relative;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(110deg, #7a0000, #b30000);
    box-shadow: 0 0 12px rgba(179, 0, 0, .35);
  }
  nav button.special:hover,
  nav button.special:focus-visible,
  nav button.special[aria-selected="true"]:hover {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(110deg, #ff1f1f, #b30000, #5c0000, #b30000, #ff1f1f);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    text-shadow: 0 1px 4px rgba(0,0,0,.55);
    box-shadow: 0 0 18px rgba(255, 31, 31, .5);
  }
  /* красный → тёмно-красный */
  nav button.red { border-color: transparent; }
  nav button.red:hover,
  nav button.red:focus-visible,
  nav button.red[aria-selected="true"]:hover {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(110deg, #ff1f1f, #b30000, #5c0000, #b30000, #ff1f1f);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    text-shadow: 0 1px 4px rgba(0,0,0,.55);
    box-shadow: 0 0 18px rgba(255, 31, 31, .45);
  }
  /* фиолетовый → тёмно-фиолетовый */
  nav button.purple,
  nav button.purple[aria-selected="true"] {
    border-color: transparent;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(110deg, #3b1473, #6d28d9);
    box-shadow: 0 0 12px rgba(109, 40, 217, .35);
  }
  nav button.purple:hover,
  nav button.purple:focus-visible,
  nav button.purple[aria-selected="true"]:hover {
    color: #fff;
    background: linear-gradient(110deg, #a855f7, #6d28d9, #3b1473, #6d28d9, #a855f7);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    text-shadow: 0 1px 4px rgba(0,0,0,.55);
    box-shadow: 0 0 18px rgba(168, 85, 247, .5);
  }
  /* синий → тёмно-синий */
  nav button.blue,
  nav button.blue[aria-selected="true"] {
    border-color: transparent;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(110deg, #0a2a6b, #1d4ed8);
    box-shadow: 0 0 12px rgba(29, 78, 216, .35);
  }
  nav button.blue:hover,
  nav button.blue:focus-visible,
  nav button.blue[aria-selected="true"]:hover {
    color: #fff;
    background: linear-gradient(110deg, #3b82f6, #1d4ed8, #0a2a6b, #1d4ed8, #3b82f6);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    text-shadow: 0 1px 4px rgba(0,0,0,.55);
    box-shadow: 0 0 18px rgba(59, 130, 246, .5);
  }
  /* зелёный → тёмно-зелёный */
  nav button.green,
  nav button.green[aria-selected="true"] {
    border-color: transparent;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(110deg, #0b4a22, #16a34a);
    box-shadow: 0 0 12px rgba(22, 163, 74, .35);
  }
  nav button.green:hover,
  nav button.green:focus-visible,
  nav button.green[aria-selected="true"]:hover {
    color: #fff;
    background: linear-gradient(110deg, #4ade80, #16a34a, #0b4a22, #16a34a, #4ade80);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    text-shadow: 0 1px 4px rgba(0,0,0,.55);
    box-shadow: 0 0 18px rgba(74, 222, 128, .5);
  }
  /* изумрудное оформление вкладки «Стрелки» */
  nav button.archers,
  nav button.archers[aria-selected="true"] {
    border-color: transparent;
    color: #f0fff8;
    font-weight: 700;
    background: linear-gradient(110deg, #063b32, #087f5b, #10b981);
    box-shadow: 0 0 14px rgba(16, 185, 129, .32);
  }
  nav button.archers:hover,
  nav button.archers:focus-visible,
  nav button.archers[aria-selected="true"]:hover {
    color: #fff;
    background: linear-gradient(110deg, #6ee7b7, #10b981, #047857, #064e3b, #6ee7b7);
    background-size: 300% 100%;
    animation: shimmer 2.8s linear infinite;
    text-shadow: 0 1px 5px rgba(0,0,0,.6);
    box-shadow: 0 0 20px rgba(52, 211, 153, .55);
  }
  .archers h2 {
    color: #087f5b;
    text-shadow: 0 0 14px rgba(16, 185, 129, .18);
  }
  .archers .acc { max-width: 620px; gap: 16px; }
  .archers .acc details,
  .archers .acc .plain {
    background: linear-gradient(115deg, #101f1b, #153c30, #10251f);
    border: 1px solid rgba(52, 211, 153, .3);
    border-left: 6px solid #10b981;
    border-radius: 10px;
    box-shadow: 0 8px 22px rgba(4, 120, 87, .16), inset 0 1px 0 rgba(255,255,255,.04);
    overflow: hidden;
  }
  .archers .acc summary,
  .archers .acc .plain {
    color: #d1fae5;
    padding: 17px 22px;
    letter-spacing: .02em;
  }
  .archers .acc summary::after {
    content: "⌄";
    color: #6ee7b7;
    font-size: 1.5rem;
    line-height: 1;
  }
  .archers .acc summary:hover { background: rgba(16, 185, 129, .13); }
  .archers .acc summary:focus-visible { outline-color: #34d399; }
  .archers .acc details[open] { border-left-color: #6ee7b7; box-shadow: 0 0 20px rgba(16, 185, 129, .2); }
  .archers .acc .more { color: #ecfdf5; padding: 4px 22px 18px; }
  .archers .acc .more p { color: #a7f3d0; font-weight: 700; }
  .archers .acc .more ul { color: #ecfdf5; }
  .archers .acc .more li::marker { color: #34d399; }
  @media (prefers-reduced-motion: reduce) {
    nav button.archers:hover, nav button.archers:focus-visible { animation: none; }
  }

  /* жёлтый → тёмно-жёлтый */
  nav button.yellow,
  nav button.yellow[aria-selected="true"] {
    border-color: transparent;
    color: #1b1d20;
    font-weight: 700;
    background: linear-gradient(110deg, #b45309, #eab308);
    box-shadow: 0 0 12px rgba(234, 179, 8, .35);
  }
  nav button.yellow:hover,
  nav button.yellow:focus-visible,
  nav button.yellow[aria-selected="true"]:hover {
    color: #1b1d20;
    background: linear-gradient(110deg, #fde047, #eab308, #b45309, #eab308, #fde047);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    box-shadow: 0 0 18px rgba(253, 224, 71, .5);
  }
  .yellow .prices .row {
    background: linear-gradient(110deg, var(--asphalt), #4a3a05);
    border-left-color: #eab308;
    box-shadow: 0 0 14px rgba(234, 179, 8, .25);
  }
  .yellow .prices .val { color: #fde047; }
  /* декоративная полоса: фиолетовый с синим, на всю ширину */
  nav .decor {
    grid-column: 1 / -1;
    padding: 16px 12px;
    border-radius: 6px;
    text-align: center;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: .04em;
    color: #fff;
    background: linear-gradient(100deg, #5b21b6, #7c3aed, #2563eb, #1d4ed8, #7c3aed, #5b21b6);
    background-size: 300% 100%;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
    box-shadow: 0 0 18px rgba(99, 102, 241, .45);
    cursor: default;
    user-select: none;
  }
  @media (prefers-reduced-motion: reduce) {
    nav .decor { animation: none; }
  }

  /* ярко-синий → белый */
  nav button.sky,
  nav button.sky[aria-selected="true"] {
    border-color: transparent;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(110deg, #0b5cff, #7fb2ff 70%, #e6f0ff);
    text-shadow: 0 0 3px #001a66, 0 1px 3px #001a66;
    box-shadow: 0 0 12px rgba(11, 92, 255, .45);
  }
  nav button.sky:hover,
  nav button.sky:focus-visible,
  nav button.sky[aria-selected="true"]:hover {
    color: #fff;
    background: linear-gradient(110deg, #e6f0ff, #7fb2ff, #0b5cff, #7fb2ff, #e6f0ff);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    box-shadow: 0 0 20px rgba(127, 178, 255, .65);
  }
  .news {
    position: relative;
    max-width: 640px;
    margin: 0 0 18px;
    padding: 28px 30px 26px;
    background: #101a33;
    border-left: 6px solid #0b5cff;
    border-radius: 10px;
    box-shadow: 0 0 22px rgba(11, 92, 255, .3);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  .news::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #0b5cff, #7fb2ff, #ffffff);
  }
  .news .tag {
    display: inline-block;
    margin-bottom: 14px;
    padding: 4px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, #7fb2ff, #e6f0ff);
    color: #06214f;
    font-weight: 700;
    font-size: .85rem;
  }
  .news p { margin: 0; max-width: none; color: #fff; font-size: 1.25rem; line-height: 1.6; }
  .news .join {
    display: inline-block;
    margin-top: 22px;
    padding: 13px 28px;
    border-radius: 8px;
    background: linear-gradient(110deg, #0b5cff, #5aa2ff, #e6f0ff, #5aa2ff, #0b5cff);
    background-size: 300% 100%;
    color: #06214f;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    box-shadow: 0 0 16px rgba(11, 92, 255, .55);
    transition: transform .15s, box-shadow .15s;
  }
  .news .join:hover,
  .news .join:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 0 26px rgba(127, 178, 255, .85);
    animation: shimmer 2.4s linear infinite;
  }
  .news .join:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .news .join:hover, .news .join:focus-visible { animation: none; }
  }
  .news mark { background: none; color: #7fb2ff; font-weight: 700; border-bottom: 2px solid #7fb2ff; }

  /* серо-чёрный */
  nav button.dark,
  nav button.dark[aria-selected="true"] {
    border-color: transparent;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(110deg, #0d0e10, #4b5057);
    box-shadow: 0 0 12px rgba(120, 126, 135, .3);
  }
  nav button.dark:hover,
  nav button.dark:focus-visible,
  nav button.dark[aria-selected="true"]:hover {
    color: #fff;
    background: linear-gradient(110deg, #9ca3af, #4b5057, #0d0e10, #4b5057, #9ca3af);
    background-size: 300% 100%;
    animation: shimmer 2.4s linear infinite;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
    box-shadow: 0 0 18px rgba(156, 163, 175, .45);
  }
  .rule {
    max-width: 720px;
    margin: 0 0 14px;
    padding: 14px 20px;
    background: #1d1f22;
    color: #e5e7eb;
    border-left: 4px solid #6b7280;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: .98rem;
    line-height: 1.65;
  }
  .rule .rn { font-weight: 700; color: #fff; margin-right: 4px; }
  .rule .pun { color: #f3f4f6; background: #3a3d42; padding: 1px 7px; border-radius: 4px; }
  .wrap hr { max-width: 720px; margin: 26px 0; border: 0; border-top: 2px dashed var(--muted); }
  @keyframes shimmer {
    from { background-position: 0% 50%; }
    to   { background-position: 300% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    nav button.special:hover,
    nav button.special:focus-visible,
    nav button.red:hover,
    nav button.red:focus-visible,
    nav button.purple:hover,
    nav button.purple:focus-visible,
    nav button.blue:hover,
    nav button.blue:focus-visible,
    nav button.green:hover,
    nav button.green:focus-visible,
    nav button.yellow:hover,
    nav button.yellow:focus-visible,
    nav button.dark:hover,
    nav button.dark:focus-visible,
    nav button.sky:hover,
    nav button.sky:focus-visible { animation: none; }
  }

  /* имена в виде плашек */
  .chips {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .chips.col { flex-direction: column; align-items: flex-start; }
  .chips li {
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 12px 22px;
    border-radius: 6px;
    background: var(--asphalt);
    color: #fff;
    border-left: 6px solid var(--line);
  }
  /* Фиолетовое оформление должностей в старшем составе */
  .group-chief, .group-deputy, .group-junior-deputy { margin: 0 0 24px; }
  .group-chief h3, .group-deputy h3, .group-junior-deputy h3 {
    display: inline-block;
    margin: 0 0 12px;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: .09em;
    text-transform: uppercase;
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rank-shimmer 5s linear infinite;
  }
  .group-chief h3 {
    background-image: linear-gradient(100deg, #b9a0ff, #54218d, #09070d, #54218d, #b9a0ff);
    filter: drop-shadow(0 0 8px rgba(109, 40, 217, .35));
  }
  .group-deputy h3 {
    background-image: linear-gradient(100deg, #e9c5ff, #c084fc, #7c3aed, #d8b4fe, #e9c5ff);
    filter: drop-shadow(0 0 9px rgba(168, 85, 247, .45));
  }
  .group-junior-deputy h3 {
    background-image: linear-gradient(100deg, #fff0ff, #f0abfc, #d946ef, #a855f7, #f5d0fe, #fff0ff);
    filter: drop-shadow(0 0 11px rgba(217, 70, 239, .65));
  }
  .group-chief .chips li, .group-deputy .chips li, .group-junior-deputy .chips li {
    background: linear-gradient(115deg, #101014, #21152d, #101014);
    background-size: 220% 100%;
    border-left-width: 4px;
    border-radius: 8px;
    -webkit-background-clip: padding-box;
    box-shadow: 0 0 14px rgba(0, 0, 0, .2);
    animation: rank-card 7s ease-in-out infinite;
  }
  .group-chief .chips li {
    border-left-color: #54218d;
    color: #c4a8ff;
    text-shadow: 0 0 10px rgba(109, 40, 217, .45);
  }
  .group-deputy .chips li {
    border-left-color: #a855f7;
    color: #d8b4fe;
    text-shadow: 0 0 11px rgba(168, 85, 247, .55);
  }
  .group-junior-deputy .chips li {
    background: linear-gradient(115deg, #211027, #54205f, #32103f, #211027);
    border-left-color: #e879f9;
    color: #f5d0fe;
    text-shadow: 0 0 12px rgba(232, 121, 249, .8);
    box-shadow: 0 0 16px rgba(217, 70, 239, .22);
  }
  .group-junior-deputy .empty {
    color: #f0abfc;
    border-color: #d946ef;
    background: rgba(168, 85, 247, .08);
    box-shadow: 0 0 12px rgba(217, 70, 239, .15);
  }
  @keyframes rank-shimmer {
    from { background-position: 0% 50%; }
    to { background-position: 260% 50%; }
  }
  @keyframes rank-card {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .group-chief h3, .group-deputy h3, .group-junior-deputy h3, .group-chief .chips li, .group-deputy .chips li, .group-junior-deputy .chips li { animation: none; }
  }

  /* цены на ранги */
  .prices { display: flex; flex-direction: column; gap: 14px; max-width: 580px; }
  .prices .row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px 20px;
    padding: 18px 24px;
    background: linear-gradient(110deg, var(--asphalt), #0f3d22);
    border-left: 6px solid #16a34a;
    border-radius: 6px;
    box-shadow: 0 0 14px rgba(22, 163, 74, .25);
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .prices .rk { font-weight: 700; font-size: 1.15rem; }
  .prices .val { font-weight: 700; font-size: 1.15rem; color: #4ade80; text-align: right; }

  /* раскрывающиеся пункты */
  .acc { display: flex; flex-direction: column; gap: 12px; max-width: 520px; }
  .acc details, .acc .plain {
    background: var(--asphalt);
    color: #fff;
    border-left: 6px solid #16a34a;
    border-radius: 6px;
    font-family: Arial, sans-serif;
  }
  .acc summary, .acc .plain {
    padding: 12px 22px;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .acc summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary::after { content: "▾"; transition: transform .2s; }
  .acc details[open] summary::after { transform: rotate(180deg); }
  .acc summary:hover { background: var(--asphalt-2); border-radius: 0 6px 6px 0; }
  .acc summary:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; }
  .acc .more { padding: 0 22px 16px; }
  .acc .more p { margin: 0 0 6px; color: #c9ccd1; }
  .acc .more ul { margin: 0; padding-left: 20px; line-height: 1.9; }

  h3 {
    font-family: Arial, sans-serif;
    font-size: 1.2rem;
    margin: 32px 0 14px;
  }
  h2 + h3 { margin-top: 0; }
  .empty {
    font-family: Arial, sans-serif;
    color: var(--muted);
    padding: 18px 22px;
    border: 2px dashed var(--muted);
    border-radius: 6px;
    max-width: 420px;
  }

  @media (max-width: 480px) {
    nav { gap: 7px; }
    nav button { font-size: .9rem; padding: 13px 7px; }
  }

  main { padding: 48px 20px 80px; }
  section[hidden] { display: none; }
  /* Цвет текста внутри вкладок соответствует цвету самой вкладки */
  section.theme-purple h2, section.theme-purple > p { color: #c4a8ff; text-shadow: 0 0 12px rgba(124, 58, 237, .22); }
  section.theme-blue h2, section.theme-blue > p { color: #93c5fd; text-shadow: 0 0 12px rgba(59, 130, 246, .2); }
  section.theme-green h2, section.theme-green > p { color: #86efac; text-shadow: 0 0 12px rgba(34, 197, 94, .2); }
  section.theme-yellow h2, section.theme-yellow > p { color: #fde047; text-shadow: 0 0 12px rgba(234, 179, 8, .2); }
  section.theme-dark h2, section.theme-dark > p { color: #cbd5e1; text-shadow: 0 0 12px rgba(148, 163, 184, .2); }
  section.theme-sky h2, section.theme-sky > p { color: #93c5fd; text-shadow: 0 0 12px rgba(59, 130, 246, .25); }
  section.theme-special h2 { color: #c4a8ff; text-shadow: 0 0 14px rgba(124, 58, 237, .4); }
  section.theme-dark .rule { border-left-color: #9ca3af; }
  section.theme-dark .rule .rn { color: #d1d5db; }
  section.theme-blue .group-deputy h3 { filter: drop-shadow(0 0 9px rgba(59, 130, 246, .5)); }
  section.theme-blue .group-deputy .chips li { border-left-color: #3b82f6; color: #bfdbfe; text-shadow: 0 0 10px rgba(59, 130, 246, .45); }
  h2 {
    font-family: Arial, sans-serif;
    font-size: 1.9rem;
    margin: 0 0 20px;
  }
  p { max-width: 68ch; margin: 0 0 1em; }

  footer {
    text-align: center;
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: .9rem;
    padding: 0 20px 40px;
  }
</style>
</head>
<body>
<div class="ambient-layer" aria-hidden="true">
  <span class="ambient-sticker symbol s1">✦</span>
  <span class="ambient-sticker s2">AFTERMATH</span>
  <span class="ambient-sticker symbol s3">⌖</span>
  <span class="ambient-sticker s4">MEMORY</span>
  <span class="ambient-sticker symbol s5">⚔</span>
  <span class="ambient-sticker s6">STRATEGY</span>
  <span class="ambient-sticker symbol s7">✧</span>
  <span class="ambient-sticker s8">LEGACY</span>
  <div class="ambient-sticker quote" id="ambient-quote" aria-hidden="true"></div>
</div>

<header>
  <video class="header-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="wrap">
    <h1 class="logo">Roads Empire</h1>
    <nav role="tablist" id="tabs"></nav>
  </div>
</header>

<main>
  <div class="wrap" id="panels"></div>
</main>

<footer>© Roads Empire</footer>

<script>
  /* ============================================================
     ЗДЕСЬ МЕНЯЮТСЯ ВКЛАДКИ И ТЕКСТЫ.
     Одна вкладка = один блок { title, text }.
     Чтобы добавить вкладку — скопируйте блок и вставьте ниже.
     Абзацы в тексте разделяйте пустой строкой.
     ============================================================ */
  const TABS = [
    /* ряд 1 */
    {
      title: "Старший состав",
      special: true,
      text: "",
      groups: [
        { label: "Chief", style: "chief", names: ["Grim_Roads"] },
        { label: "Deputy", style: "deputy", names: ["Sharp_Roads", "Tom_Roads"] }
      ]
    },
    {
      title: "Замы",
      blue: true,
      text: "",
      groups: [
        { label: "Deputy", style: "deputy", names: ["Sharp_Roads", "Tom_Roads"] },
        { label: "Junior Deputy", style: "junior-deputy", names: [] }
      ]
    },
    {
      title: "Стрелки",
      archers: true,
      text: "",
      items: [
        { name: "Привилегии", lead: "Что выдаётся:", details: ["Патроны", "Бронежилеты"] },
        { name: "Ранг", lead: "Даётся 3-й ранг", details: [] }
      ]
    },
    /* ряд 2 начинается с вкладки 5 */
    {
      title: "Цены на ранги",
      yellow: true,
      text: "",
      prices: [
        { rank: "4 ранг", value: "доверие & покупка буста в Discord сервере" },
        { rank: "3 ранг", value: "200.000" },
        { rank: "2 ранг", value: "100.000" }
      ]
    },
    {
      title: "Правила",
      dark: true,
      rules: true,
      text: `[1.0] Заходя в нашу семью, вы автоматически соглашаетесь с данным сводом правил, перечисленными ниже. НЕЗНАНИЕ ПРАВИЛ НЕ ОСВОБОЖДАЕТ ВАС ОТ ОТВЕТСТВЕННОСТИ!

[1.1] Данный свод правил может изменяться без уведомлений.

[1.2] Старшая Администрация (ЛИДЕР, ГЗ) семьи в праве выбирать меру наказания, основываясь на сложившейся ситуации, игнорируя рамки, указанные в правилах. Степень адекватности наказания оценивается только Старшим составом семьи.

[1.3] Некорректные действия игроков, заместители и иных участников семьи, за исключением владельца, подлежат обжалованию.

--------------------------------------------------------------------------------------------------

[2.1] Игра без читов, посторонних запрещенных программ запрещенных в игре.*Наказание։ Кик из семьи

[2.2] Оскорбление, унижение, упоминание родных в плохом свете. Наказание։ Мут от 30-ти до 2-х часов, в зависимости от оскорбления

[2.3] Запрещено устраивать войны семей, провоцировать посторонних на НЕ согласованные действия с игроками в семье со статусом ГЗ и старше. Наказание։ Кик из семьи (ВОЗМОЖНОЕ, рассмотрение на возврат)

Обжаловать решение, (поступок со-фамильца) можно обратившись в к главному заму в личку в тг: @Abiroz_Kawkaski ։`
    },
    {
      title: "Новости",
      sky: true,
      text: "",
      news: [
        {
          text: "Все кто даст (1-2) буст серверу будет повышен в звании до заместителя в DS канале",
          hl: ["(1-2) буст", "заместителя"],
          link: { url: "https://discord.gg/PvCEfYVwm", label: "Перейти в Discord" }
        }
      ]
    },
    /* ряд 3 */
    /* декоративная полоса на всю ширину (не открывает вкладку) */
    { title: "После садика на капт", decor: true }
  ];

  /* ---------- дальше ничего менять не нужно ---------- */
  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");

  function esc(s) {
    return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  /* оформление правил: номер пункта, «Наказание», разделитель */
  function rulesHtml(text) {
    return text.split(/\n\s*\n/).map(p => {
      p = p.trim();
      if (/^-{5,}$/.test(p)) return "<hr>";
      const h = esc(p)
        .replace(/^\[(\d+\.\d+)\]/, '<span class="rn">[$1]</span>')
        .replace(/(Наказание\s*[։:])/g, '<strong class="pun">$1</strong>')
        .replace(/\n/g, "<br>");
      return '<p class="rule">' + h + "</p>";
    }).join("");
  }

  /* новости: карточки с выделенными словами */
  function newsHtml(list) {
    return list.map(n => {
      let h = esc(n.text);
      (n.hl || []).forEach(w => { h = h.split(esc(w)).join("<mark>" + esc(w) + "</mark>"); });
      const link = n.link && /^https:\/\//.test(n.link.url)
        ? '<a class="join" href="' + esc(n.link.url) + '" target="_blank" rel="noopener noreferrer">' + esc(n.link.label) + "</a>"
        : "";
      return '<article class="news"><span class="tag">' + esc(n.tag || "Новость") + "</span><p>" + h + "</p>" + link + "</article>";
    }).join("");
  }

  TABS.forEach((t, i) => {
    if (t.decor) {
      const d = document.createElement("div");
      d.className = "decor";
      d.textContent = t.title;
      tabsEl.appendChild(d);
      return;
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.role = "tab";
    btn.id = "tab-" + i;
    btn.textContent = t.title;
    btn.setAttribute("aria-controls", "panel-" + i);
    btn.addEventListener("click", () => select(i));
    tabsEl.appendChild(btn);

    const panel = document.createElement("section");
    panel.id = "panel-" + i;
    panel.role = "tabpanel";
    panel.setAttribute("aria-labelledby", "tab-" + i);
    if (t.special) { btn.classList.add("special"); panel.classList.add("theme-special"); }
    if (t.red) { btn.classList.add("red"); panel.classList.add("theme-red"); }
    if (t.purple) { btn.classList.add("purple"); panel.classList.add("theme-purple"); }
    if (t.blue) { btn.classList.add("blue"); panel.classList.add("theme-blue"); }
    if (t.green) { btn.classList.add("green"); panel.classList.add("theme-green"); }
    if (t.archers) { btn.classList.add("archers"); panel.classList.add("archers", "theme-green"); }
    if (t.dark) { btn.classList.add("dark"); panel.classList.add("theme-dark"); }
    if (t.sky) { btn.classList.add("sky"); panel.classList.add("theme-sky"); }
    if (t.yellow) { btn.classList.add("yellow"); panel.classList.add("yellow", "theme-yellow"); }
    panel.innerHTML =
      "<h2>" + esc(t.title) + "</h2>" +
      (t.news
        ? newsHtml(t.news)
        : t.rules
        ? rulesHtml(t.text)
        : t.prices
        ? '<div class="prices">' + t.prices.map(p =>
            '<div class="row"><span class="rk">' + esc(p.rank) + '</span><span class="val">' + esc(p.value) + "</span></div>"
          ).join("") + "</div>"
        : t.items
        ? '<div class="acc">' + t.items.map(it => it.details
            ? '<details><summary>' + esc(it.name) + '</summary><div class="more">' +
                (it.lead ? "<p>" + esc(it.lead) + "</p>" : "") +
                "<ul>" + it.details.map(d => "<li>" + esc(d) + "</li>").join("") + "</ul></div></details>"
            : '<div class="plain">' + esc(it.name) + "</div>"
          ).join("") + "</div>"
        : t.groups
        ? t.groups.map(g =>
            '<div class="group-' + (g.style || 'default') + '"><h3>' + esc(g.label) + "</h3>" +
            (g.names.length
              ? '<ul class="chips">' + g.names.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul>"
              : '<div class="empty">Пока что пусто</div>') + '</div>'
          ).join("")
        : t.list
        ? '<ul class="chips' + (t.column ? " col" : "") + '">' + t.text.split("\n").filter(Boolean).map(n => "<li>" + esc(n) + "</li>").join("") + "</ul>"
        : t.text.split(/\n\s*\n/).map(p => "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>").join(""));
    panelsEl.appendChild(panel);
  });

  function select(i) {
    tabsEl.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", j === i));
    panelsEl.querySelectorAll("section").forEach((s, j) => s.hidden = j !== i);
    history.replaceState(null, "", "#" + (i + 1));
  }

  const start = parseInt(location.hash.slice(1), 10) - 1;
  select(start >= 0 && start < TABS.filter(t => !t.decor).length ? start : 0);

  /* Короткие исторические цитаты. Карточка плавно перемещается по фону. */
  const ambientQuote = document.getElementById("ambient-quote");
  const quotes = [
    { text: "«Война — это ад.»", author: "Уильям Текумсе Шерман" },
    { text: "«Никогда столько людей не было обязано столь немногим.»", author: "Уинстон Черчилль" },
    { text: "«Война — дело жизни и смерти государства.»", author: "Сунь-цзы · пересказ" },
    { text: "«Каждая война — поражение человечества.»", author: "Иоанн Павел II" }
  ];
  const quoteSpots = [
    { top: "18%", left: "7%", right: "auto", bottom: "auto" },
    { top: "29%", left: "auto", right: "6%", bottom: "auto" },
    { top: "auto", left: "12%", right: "auto", bottom: "17%" },
    { top: "auto", left: "auto", right: "8%", bottom: "13%" },
    { top: "52%", left: "38%", right: "auto", bottom: "auto" }
  ];
  let quoteIndex = 0;
  let spotIndex = 0;
  function moveQuote() {
    ambientQuote.classList.remove("show");
    window.setTimeout(() => {
      const q = quotes[quoteIndex];
      const spot = quoteSpots[spotIndex];
      ambientQuote.innerHTML = esc(q.text) + "<small>— " + esc(q.author) + "</small>";
      ambientQuote.style.top = spot.top;
      ambientQuote.style.left = spot.left;
      ambientQuote.style.right = spot.right;
      ambientQuote.style.bottom = spot.bottom;
      requestAnimationFrame(() => ambientQuote.classList.add("show"));
      quoteIndex = (quoteIndex + 1) % quotes.length;
      spotIndex = (spotIndex + 1) % quoteSpots.length;
    }, 900);
  }
  moveQuote();
  window.setInterval(moveQuote, 6500);

  /* Наклейки тоже медленно меняют расположение, создавая эффект переливания. */
  const stickerSpots = [
    { top: "12%", left: "6%", right: "auto", bottom: "auto" },
    { top: "37%", left: "auto", right: "5%", bottom: "auto" },
    { top: "auto", left: "8%", right: "auto", bottom: "16%" },
    { top: "auto", left: "auto", right: "9%", bottom: "11%" },
    { top: "64%", left: "44%", right: "auto", bottom: "auto" },
    { top: "23%", left: "auto", right: "22%", bottom: "auto" },
    { top: "auto", left: "28%", right: "auto", bottom: "9%" },
    { top: "8%", left: "auto", right: "34%", bottom: "auto" }
  ];
  const movingStickers = [...document.querySelectorAll(".ambient-sticker:not(.quote)")];
  let stickerTurn = 0;
  function moveStickers() {
    movingStickers.forEach((sticker, i) => {
      const spot = stickerSpots[(i + stickerTurn) % stickerSpots.length];
      sticker.style.top = spot.top;
      sticker.style.left = spot.left;
      sticker.style.right = spot.right;
      sticker.style.bottom = spot.bottom;
    });
    stickerTurn = (stickerTurn + 2) % stickerSpots.length;
  }
  window.setInterval(moveStickers, 7200);
</script>
</body>
</html>
